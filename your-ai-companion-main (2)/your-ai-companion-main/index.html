<div class="checkout-container">
  <div class="card" id="creditCard">
    <div class="inner">
      <!-- وجه البطاقة الأمامي -->
      <div class="front">
        <div class="card-brand" id="cardBrand">VISA</div>
        <div class="card-chip"></div>
        <div class="card-number">4242 4242 4242 4242</div>
        <div class="card-details">
          <div class="holder">
            <span class="label">CARD HOLDER</span>
            <span class="value">MOHAMED AMINE</span>
          </div>
          <div class="expiry">
            <span class="label">VALID THRU</span>
            <span class="value">09/29</span>
          </div>
        </div>
      </div>
      <!-- ظهر البطاقة الخلفي -->
      <div class="back">
        <div class="magnetic-strip"></div>
        <div class="cvv-box">
          <span class="label">CVV</span>
          <span class="cvv-value">123</span>
        </div>
      </div>
    </div>
  </div>

  <!-- حقول الإدخال لتجربة التفاعل -->
  <div class="form-inputs">
    <input type="text" id="cardNumberInput" placeholder="Card Number" maxlength="16">
    <input type="text" id="cvvInput" placeholder="CVV" maxlength="3">
  </div>
</div>
<div class="login-container">
  <div class="login-card">
    <h2>Sbaihi AI</h2>
    <p class="subtitle">Welcome back, access your intelligence</p>
    
    <form>
      <div class="input-group">
        <label>Email</label>
        <input type="email" placeholder="hi@example.com" required />
      </div>
      
      <div class="input-group">
        <label>Password</label>
        <input type="password" placeholder="••••••••" required />
      </div>
      
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</div>
